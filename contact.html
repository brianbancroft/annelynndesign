<body class="soft">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="site-header__logo" href="/" aria-label="Anne-Lynn Design — home">
      <img src="/img/home/logo-white.png" alt="" width="68" height="88" />
    </a>
  </header>

  <main id="main" class="contact">
    <form id="contact-form" class="contact__form" novalidate>
      <h1 class="page-title">Contact</h1>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required />
      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAFBdCAoCi_im3xW-"></div>
      <button type="submit">SUBMIT</button>
      <p class="form-status" role="status" aria-live="polite"></p>
    </form>
    <div class="contact__pitch">
      <p>I’m Anne-Lynn, a graphic designer who loves turning ideas into things people can see, hold, and understand.</p>
      <p>I’m always excited to work with people who have something to say. <span class="contact__cta">If you have a project in mind, I’d love to hear about it.</span></p>
    </div>
  </main>

  <site-nav></site-nav>
</body>
